<!-- СРАВНЕНИЕ: две полосы разной длины — «стало» против «было».
     Анимация: grow-x короткой полосы, затем длинной. Показывает выигрыш нагляднее слов. -->
<div class="card" data-card-id="card-vs">
<style>
    .card[data-card-id="card-vs"] .root { width:100%; height:100%; background:transparent;
      display:flex; flex-direction:column; justify-content:center; padding:0 40px; }
    .card[data-card-id="card-vs"] .kick { font-family:'Onest',sans-serif; font-size:26px; letter-spacing:.18em;
      text-transform:uppercase; color:#fff; opacity:.92; }
    .card[data-card-id="card-vs"] .big { font-family:'Oswald',sans-serif; font-weight:700; font-size:180px;
      line-height:.95; text-transform:uppercase; color:#fff;
      text-shadow:0 10px 34px rgba(0,0,0,.75), 0 2px 8px rgba(0,0,0,.9); }
    .card[data-card-id="card-vs"] .script { font-family:'Caveat',cursive; font-size:68px; color:#fff;
      text-shadow:0 6px 22px rgba(0,0,0,.92); }
    .card[data-card-id="card-vs"] .glass { background:rgba(10,10,12,.62); border:1px solid rgba(255,255,255,.10);
      border-radius:28px; padding:34px 36px; box-shadow:0 24px 60px rgba(0,0,0,.55); }
    .card[data-card-id="card-vs"] .accent { color:var(--accent-1); }
    .card[data-card-id="card-vs"] .char { display:inline-block; }
</style>
  <div class="root">
    <div class="glass" id="card-vs-glass">
      <div class="kick" style="margin-bottom:14px;">{{ВАРИАНТ А}}</div>
      <div style="display:flex;align-items:baseline;gap:18px;line-height:1;">
        <div class="big" id="card-vs-a" style="color:var(--accent-1);">{{ЧИСЛО}}</div>
        <div class="big" style="font-size:78px;">{{ЕДИНИЦЫ}}</div>
      </div>
      <div id="card-vs-bar1" style="height:14px;border-radius:999px;background:var(--accent-1);width:0;"></div>
      <div class="kick" style="margin-top:38px;margin-bottom:10px;">{{ВАРИАНТ Б}}</div>
      <div class="big" id="card-vs-b" style="font-size:116px;opacity:.9;">{{СКОЛЬКО БЫЛО}}</div>
      <div id="card-vs-bar2" style="height:14px;border-radius:999px;background:rgba(255,255,255,.35);width:0;"></div>
    </div>
  </div>
</div>
