<!-- ТИТУЛ: мелкое сверху → крупное → мелкое снизу. Первые 5–9 секунд ролика.
     Анимация: chars(title) + slide(script). Держит зашедшего: он за секунду понимает, куда попал. -->
<div class="card" data-card-id="card-title">
<style>
    .card[data-card-id="card-title"] .root { width:100%; height:100%; background:transparent;
      display:flex; flex-direction:column; justify-content:flex-end; padding-bottom:430px; padding:0 40px; }
    .card[data-card-id="card-title"] .kick { font-family:'Onest',sans-serif; font-size:26px; letter-spacing:.18em;
      text-transform:uppercase; color:#fff; opacity:.92; }
    .card[data-card-id="card-title"] .big { font-family:'Oswald',sans-serif; font-weight:700; font-size:132px;
      line-height:.95; text-transform:uppercase; color:#fff;
      text-shadow:0 10px 34px rgba(0,0,0,.75), 0 2px 8px rgba(0,0,0,.9); }
    .card[data-card-id="card-title"] .script { font-family:'Caveat',cursive; font-size:68px; color:#fff;
      text-shadow:0 6px 22px rgba(0,0,0,.92); }
    .card[data-card-id="card-title"] .glass { background:rgba(10,10,12,.62); border:1px solid rgba(255,255,255,.10);
      border-radius:28px; padding:34px 36px; box-shadow:0 24px 60px rgba(0,0,0,.55); }
    .card[data-card-id="card-title"] .accent { color:var(--accent-1); }
    .card[data-card-id="card-title"] .char { display:inline-block; }
</style>
  <div class="root">
    <div class="kick" id="card-title-kick">{{НАДЗАГОЛОВОК}}</div>
    <div class="big" id="card-title-main">{{ГЛАВНАЯ СТРОКА}}</div>
    <div class="script" id="card-title-script">{{рукописная строка}}</div>
  </div>
</div>
