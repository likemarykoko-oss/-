<!-- ЧЕК-ЛИСТ: пункты выезжают по очереди под перечисление в речи.
     Анимация: slide каждой строки со сдвигом 0.16 сек. Не больше 4 пунктов. -->
<div class="card" data-card-id="card-check">
<style>
    .card[data-card-id="card-check"] .root { width:100%; height:100%; background:transparent;
      display:flex; flex-direction:column; justify-content:flex-start; padding-top:40px; padding:0 40px; }
    .card[data-card-id="card-check"] .kick { font-family:'Onest',sans-serif; font-size:26px; letter-spacing:.18em;
      text-transform:uppercase; color:#fff; opacity:.92; }
    .card[data-card-id="card-check"] .big { font-family:'Oswald',sans-serif; font-weight:700; font-size:64px;
      line-height:.95; text-transform:uppercase; color:#fff;
      text-shadow:0 10px 34px rgba(0,0,0,.75), 0 2px 8px rgba(0,0,0,.9); }
    .card[data-card-id="card-check"] .script { font-family:'Caveat',cursive; font-size:68px; color:#fff;
      text-shadow:0 6px 22px rgba(0,0,0,.92); }
    .card[data-card-id="card-check"] .glass { background:rgba(10,10,12,.62); border:1px solid rgba(255,255,255,.10);
      border-radius:28px; padding:34px 36px; box-shadow:0 24px 60px rgba(0,0,0,.55); }
    .card[data-card-id="card-check"] .accent { color:var(--accent-1); }
    .card[data-card-id="card-check"] .char { display:inline-block; }
</style>
  <div class="root">
    <div class="glass" id="card-check-glass">
      <div class="kick" style="margin-bottom:6px;">{{ЗАГОЛОВОК СПИСКА}}</div>
      <div id="card-check-row0" style="display:flex;align-items:center;gap:18px;margin-top:18px;">
        <div style="width:44px;height:44px;border-radius:12px;background:var(--accent-2);display:flex;
             align-items:center;justify-content:center;color:#0b0b0d;font-size:26px;font-weight:700;">✓</div>
        <div class="big">{{ПУНКТ 1}}</div></div>
      <div id="card-check-row1" style="display:flex;align-items:center;gap:18px;margin-top:18px;">
        <div style="width:44px;height:44px;border-radius:12px;background:var(--accent-2);display:flex;
             align-items:center;justify-content:center;color:#0b0b0d;font-size:26px;font-weight:700;">✓</div>
        <div class="big">{{ПУНКТ 2}}</div></div>
      <div id="card-check-row2" style="display:flex;align-items:center;gap:18px;margin-top:18px;">
        <div style="width:44px;height:44px;border-radius:12px;background:var(--accent-2);display:flex;
             align-items:center;justify-content:center;color:#0b0b0d;font-size:26px;font-weight:700;">✓</div>
        <div class="big">{{ПУНКТ 3}}</div></div>
    </div>
  </div>
</div>
