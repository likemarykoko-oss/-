<!-- ЛОУЭР-ТРЕТИЙ: короткая подпись внизу, пока она говорит. Не перекрывает лицо.
     Анимация: slide снизу + grow-x полоски под текстом. -->
<div class="card" data-card-id="card-lower">
<style>
    .card[data-card-id="card-lower"] .root { width:100%; height:100%; background:transparent;
      display:flex; flex-direction:column; justify-content:flex-start; padding-top:30px; padding:0 40px; }
    .card[data-card-id="card-lower"] .kick { font-family:'Onest',sans-serif; font-size:26px; letter-spacing:.18em;
      text-transform:uppercase; color:#fff; opacity:.92; }
    .card[data-card-id="card-lower"] .big { font-family:'Oswald',sans-serif; font-weight:700; font-size:96px;
      line-height:.95; text-transform:uppercase; color:#fff;
      text-shadow:0 10px 34px rgba(0,0,0,.75), 0 2px 8px rgba(0,0,0,.9); }
    .card[data-card-id="card-lower"] .script { font-family:'Caveat',cursive; font-size:68px; color:#fff;
      text-shadow:0 6px 22px rgba(0,0,0,.92); }
    .card[data-card-id="card-lower"] .glass { background:rgba(10,10,12,.62); border:1px solid rgba(255,255,255,.10);
      border-radius:28px; padding:34px 36px; box-shadow:0 24px 60px rgba(0,0,0,.55); }
    .card[data-card-id="card-lower"] .accent { color:var(--accent-1); }
    .card[data-card-id="card-lower"] .char { display:inline-block; }
</style>
  <div class="root">
    <div class="glass" id="card-lower-glass">
      <div class="kick">{{НАДПИСЬ}}</div>
      <div class="big" id="card-lower-title">{{ГЛАВНОЕ СЛОВО}}</div>
      <div id="card-lower-bar" style="height:12px;border-radius:999px;background:var(--accent-3);width:0;margin-top:18px;"></div>
      <div style="font-family:'Onest',sans-serif;font-size:32px;color:#fff;opacity:.9;margin-top:14px;">{{пояснение}}</div>
    </div>
  </div>
</div>
